name: Build Hostinger website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run typecheck && npm test && npm run build && python3 scripts/check-export.py
        working-directory: source
        env:
          SITE_URL: https://www.runwaymemo.com
      - uses: actions/checkout@v4
        with:
          ref: hostinger-deploy
          path: published
      - name: Publish static files only
        run: |
          rsync -a --delete --exclude='.git' source/out/ published/
          cp source/deploy/hostinger/.htaccess published/.htaccess
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Hostinger export from ${GITHUB_SHA}"
            git push origin HEAD:hostinger-deploy
          fi
